<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fern & Co. (demo store)</title>
  <link rel="stylesheet" href="demo.css">
  <script src="/tracker.js" defer></script>
</head>
<body>
  <header>
    <p class="logo">Fern &amp; Co.</p>
    <nav><a href="index.html">Shop</a><a href="product.html">Featured</a><a href="#" id="cart-link">Cart</a></nav>
  </header>
  <main>
    <section class="hero">
      <h1>Autumn essentials</h1>
      <p>Demo store. Every page view and click here is tracked and shows up in the dashboard.</p>
      <a class="btn" id="shop-now" href="product.html">Shop the collection</a>
    </section>
    <div class="grid">
      <div class="card"><div class="swatch" style="background:#b5838d"></div><h3>Wool scarf</h3><p class="price">$39</p><a class="btn" href="product.html">View</a></div>
      <div class="card"><div class="swatch" style="background:#6d6875"></div><h3>Canvas tote</h3><p class="price">$29</p><a class="btn" href="product.html">View</a></div>
      <div class="card"><div class="swatch" style="background:#e5989b"></div><h3>Knit beanie</h3><p class="price">$24</p><a class="btn" href="product.html">View</a></div>
      <div class="card"><div class="swatch" style="background:#588157"></div><h3>Rain jacket</h3><p class="price">$119</p><a class="btn" href="product.html">View</a></div>
    </div>
  </main>
  <footer>Demo page for the analytics assignment</footer>
</body>
</html>
