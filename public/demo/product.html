<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rain jacket | Fern & Co. (demo store)</title>
  <link rel="stylesheet" href="demo.css">
  <script src="/tracker.js" defer></script>
</head>
<body>
  <header>
    <p class="logo">Fern &amp; Co.</p>
    <nav><a href="index.html">Shop</a><a href="product.html">Featured</a><a href="#" id="cart-link">Cart</a></nav>
  </header>
  <main>
    <div class="product">
      <div class="swatch" style="background:#588157"></div>
      <div>
        <h1>Rain jacket</h1>
        <p class="price">$119</p>
        <p>Lightweight, packable, and fully seam-sealed. Demo product: nothing is actually for sale.</p>
        <div class="sizes">
          <button class="secondary" id="size-s">S</button>
          <button class="secondary" id="size-m">M</button>
          <button class="secondary" id="size-l">L</button>
        </div>
        <button id="add-to-cart">Add to cart</button>
        <p id="msg" hidden>Added to cart (demo).</p>
      </div>
    </div>
  </main>
  <footer><a href="index.html">Back to shop</a></footer>
  <script>
    document.getElementById('add-to-cart').onclick = () => (document.getElementById('msg').hidden = false);
  </script>
</body>
</html>
